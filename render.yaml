services:
  - type: web
    name: civic-eye-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: civic-eye-db
          property: connectionString
      - key: MEDIA_ROOT
        value: /app/media
      - key: CORS_ORIGINS
        value: "*"
      - key: MAX_IMAGE_MB
        value: "10"
      - key: MAX_CLIP_MB
        value: "40"
      - key: WASTE_MATCH_RADIUS_METERS
        value: "20"
      - key: POTHOLE_MATCH_RADIUS_METERS
        value: "12"
      - key: WATERLOG_MATCH_RADIUS_METERS
        value: "25"

databases:
  - name: civic-eye-db
    plan: free
    postgresMajorVersion: "16"
